<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="Sauryaman Bisen">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create your MONTGOMERY account to save properties, contact agents, and list your own properties.">
    <title>Register | MONTGOMERY</title>
    <link rel="shortcut icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0" />
    <link rel="stylesheet" href="./assets/css/style.css">
  </head>
  <body class="auth-page">

    <header class="header header-auth">
      <div class="container header-container">
        <a href="index.html" class="logo" aria-label="MONTGOMERY Home">
          <svg class="logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M16 2.5 L30.5 15.5 L27 19 L16 9.5 L5 19 L1.5 15.5 Z" fill="currentColor"/>
            <path d="M16 13.5 L24 20.5 V30 H19 V21 H13 V30 H8 V20.5 Z" fill="currentColor"/>
          </svg>
          <span class="logo-text">MONTGOMERY</span>
        </a>
      </div>
    </header>

    <main class="auth-main">
      <div class="auth-container">
        <div class="auth-card">
          <div class="auth-header">
            <h1 class="auth-title">Create Account</h1>
            <p class="auth-subtitle">Create an account to save properties, track listings, and contact agents.</p>
          </div>

          <form class="auth-form" id="registerForm" novalidate>
            <div class="form-group">
              <label for="registerName" class="form-label">Full Name</label>
              <div class="input-wrapper">
                <span class="material-symbols-rounded input-icon" aria-hidden="true">person</span>
                <input type="text" id="registerName" class="form-input" placeholder="John Doe" required autocomplete="name">
              </div>
              <span class="form-error" id="registerNameError"></span>
            </div>

            <div class="form-group">
              <label for="registerEmail" class="form-label">Email Address</label>
              <div class="input-wrapper">
                <span class="material-symbols-rounded input-icon" aria-hidden="true">mail</span>
                <input type="email" id="registerEmail" class="form-input" placeholder="you@example.com" required autocomplete="email">
              </div>
              <span class="form-error" id="registerEmailError"></span>
            </div>

            <div class="form-group">
              <label for="registerPassword" class="form-label">Password</label>
              <div class="input-wrapper">
                <span class="material-symbols-rounded input-icon" aria-hidden="true">lock</span>
                <input type="password" id="registerPassword" class="form-input" placeholder="Min. 8 characters" required autocomplete="new-password" minlength="8">
                <button type="button" class="password-toggle" aria-label="Toggle password visibility" data-toggle-password="registerPassword">
                  <span class="material-symbols-rounded" aria-hidden="true">visibility</span>
                </button>
              </div>
              <span class="form-error" id="registerPasswordError"></span>
              <div class="password-strength" id="passwordStrength">
                <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                <span class="strength-text" id="strengthText"></span>
              </div>
            </div>

            <div class="form-group">
              <label for="registerConfirm" class="form-label">Confirm Password</label>
              <div class="input-wrapper">
                <span class="material-symbols-rounded input-icon" aria-hidden="true">lock</span>
                <input type="password" id="registerConfirm" class="form-input" placeholder="Repeat your password" required autocomplete="new-password">
                <button type="button" class="password-toggle" aria-label="Toggle password visibility" data-toggle-password="registerConfirm">
                  <span class="material-symbols-rounded" aria-hidden="true">visibility</span>
                </button>
              </div>
              <span class="form-error" id="registerConfirmError"></span>
            </div>

            <div class="form-status" id="registerStatus"></div>

            <button type="submit" class="btn btn-primary btn-full" id="registerSubmit">
              <span class="btn-text">Create Account</span>
              <span class="btn-loader" style="display:none;"></span>
            </button>
          </form>

          <p class="auth-footer-text">
            Already have an account? <a href="signin.html" class="auth-link">Sign in here</a>
          </p>
          <p class="demo-notice auth-demo-notice">This is a prototype interface. No real authentication is configured.</p>
        </div>
      </div>
    </main>

    <script src="./assets/js/auth.js"></script>
  </body>
</html>
