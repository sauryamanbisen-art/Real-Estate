<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="Sauryaman Bisen">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MONTGOMERY: Find luxury homes, apartments, and residential properties across premier locations.">

    <meta property="og:title" content="MONTGOMERY | Premium Real Estate">
    <meta property="og:description" content="Find luxury homes, apartments, and residential properties across premier locations.">
    <meta property="og:type" content="website">
    <title>MONTGOMERY | Premium Real Estate</title>

    <link rel="shortcut icon" href="./favicon.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0" />

    <link rel="stylesheet" href="./assets/css/style.css">

    <script src="./assets/js/script.js" defer></script>

  <body>

    <!-- ==================== HEADER ==================== -->
    <header class="header" id="header" data-header>
      <div class="container header-container">

        <a href="index.html" class="logo" aria-label="MONTGOMERY Home">
          <svg class="logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M16 2.5 L30.5 15.5 L27 19 L16 9.5 L5 19 L1.5 15.5 Z" fill="currentColor"/>
            <path d="M16 13.5 L24 20.5 V30 H19 V21 H13 V30 H8 V20.5 Z" fill="currentColor"/>
          </svg>
          <span class="logo-text">MONTGOMERY</span>
        </a>

        <nav class="navbar" id="navbar" data-navbar>
          <ul class="navbar-list">
            <li><a href="#hero" class="nav-link active">HOME</a></li>
            <li><a href="#properties" class="nav-link">RENT</a></li>
            <li><a href="sell.html" class="nav-link">SELL</a></li>
            <li><a href="#agents" class="nav-link">AGENTS</a></li>
          </ul>

          <div class="navbar-actions">
            <a href="register.html" class="nav-action-link">Register</a>
            <span class="nav-action-divider" aria-hidden="true">|</span>
            <a href="signin.html" class="nav-action-link">Sign In</a>
            <span class="nav-action-divider nav-action-divider-end" aria-hidden="true">|</span>
          </div>

          <div class="navbar-contact">
            <a href="mailto:hello@montgomery.com" class="nav-contact-btn" aria-label="Email us" title="Email us">
              <svg class="nav-contact-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                <path d="M22 6 L12 13 L2 6"></path>
              </svg>
              <span class="mobile-contact-label">Email Us</span>
            </a>
            <a href="tel:+1234567890" class="nav-contact-btn" aria-label="Call us" title="Call us">
              <svg class="nav-contact-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
              </svg>
              <span class="mobile-contact-label">Call Us</span>
            </a>
          </div>
        </nav>

        <button class="nav-toggle-btn" aria-label="Toggle navigation menu" data-nav-toggler aria-expanded="false" aria-controls="navbar">
          <svg class="hamburger-icon open" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
          <svg class="hamburger-icon close" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>

      </div>
    </header>

    <div class="navbar-backdrop" id="navbarBackdrop" data-nav-backdrop aria-hidden="true"></div>

    <main>

      <!-- ==================== HERO SECTION ==================== -->
      <section class="hero" id="hero">
        <div class="hero-bg">
          <img src="./assets/images/hero-bg.jpg" alt="Luxury modern home at dusk with warm interior lighting" class="hero-bg-img" width="1920" height="1080" fetchpriority="high">
          <div class="hero-overlay"></div>
        </div>

        <div class="container hero-container">
          <div class="hero-content">
            <div class="hero-accent-line" aria-hidden="true"></div>
            <h1 class="hero-title">
              Find the Home<br>
              That Fits Your<br>
              <span class="gold-text"><em>Life</em></span>
            </h1>
            <p class="hero-description">
              Curated houses, apartments, and investment properties in premier neighborhoods.
            </p>
            <div class="hero-actions">
              <a href="#search" class="btn btn-primary" id="explorePropertiesBtn">
                <span>Explore Properties</span>
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                  <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
              </a>
            </div>
          </div>
        </div>

        <a href="#search" class="hero-scroll-indicator" id="heroScrollIndicator" aria-label="Scroll to search section">
          <div class="hero-scroll-pill">
            <span class="hero-scroll-dot"></span>
            <span class="hero-scroll-dot-subtle"></span>
          </div>
          <div class="hero-scroll-stem"></div>
        </a>
      </section>

        </main>

</html>
