<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="Sauryaman Bisen">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in to your MONTGOMERY account to save properties, contact agents, and manage your listings.">
    <title>Sign In | MONTGOMERY</title>
    <link rel="shortcut icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0" />
    <link rel="stylesheet" href="./assets/css/style.css">
  </head>
  <body class="auth-page">

    <header class="header header-auth">
      <div class="container header-container">
        <a href="index.html" class="logo" aria-label="MONTGOMERY Home">
          <svg class="logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M16 2.5 L30.5 15.5 L27 19 L16 9.5 L5 19 L1.5 15.5 Z" fill="currentColor"/>
            <path d="M16 13.5 L24 20.5 V30 H19 V21 H13 V30 H8 V20.5 Z" fill="currentColor"/>
          </svg>
          <span class="logo-text">MONTGOMERY</span>
        </a>
      </div>
    </header>

    <main class="auth-main">
      <div class="auth-container">
        <div class="auth-card">
          <div class="auth-header">
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Sign in to access your account and saved properties.</p>
          </div>

          <form class="auth-form" id="signinForm" novalidate>
            <div class="form-group">
              <label for="signinEmail" class="form-label">Email Address</label>
              <div class="input-wrapper">
                <span class="material-symbols-rounded input-icon" aria-hidden="true">mail</span>
                <input type="email" id="signinEmail" class="form-input" placeholder="you@example.com" required autocomplete="email">
              </div>
              <span class="form-error" id="signinEmailError"></span>
            </div>

            <div class="form-group">
              <label for="signinPassword" class="form-label">Password</label>
              <div class="input-wrapper">
                <span class="material-symbols-rounded input-icon" aria-hidden="true">lock</span>
                <input type="password" id="signinPassword" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
                <button type="button" class="password-toggle" aria-label="Toggle password visibility" data-toggle-password="signinPassword">
                  <span class="material-symbols-rounded" aria-hidden="true">visibility</span>
                </button>
              </div>
              <span class="form-error" id="signinPasswordError"></span>
            </div>

            <div class="form-status" id="signinStatus"></div>

            <button type="submit" class="btn btn-primary btn-full" id="signinSubmit">
              <span class="btn-text">Sign In</span>
              <span class="btn-loader" style="display:none;"></span>
            </button>
          </form>

          <p class="auth-footer-text">
            Don't have an account? <a href="register.html" class="auth-link">Register here</a>
          </p>
          <p class="demo-notice auth-demo-notice">This is a prototype interface. No real authentication is configured.</p>
        </div>
      </div>
    </main>

    <script src="./assets/js/auth.js"></script>
  </body>
</html>
